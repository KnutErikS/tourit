<html lang="no">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"Barlow Condensed";font-weight:700;src:url(../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-700-normal.woff2) format("woff2")}

.icon{width:400px;height:400px;flex:none;border-radius:56px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.icon svg{display:block;width:100%;height:100%}
h1{margin:0;font:700 116px/0.95 "Barlow Condensed",sans-serif;color:#F4F8FC;letter-spacing:.01em}
p{margin:22px 0 0;font:500 38px/1.25 "Barlow",sans-serif;color:#BCD3E8}
small{display:block;margin-top:34px;font:500 22px "IBM Plex Mono",monospace;color:#7E9BBC;letter-spacing:.02em}
.danger{position:absolute;left:0;right:0;bottom:0;height:14px;display:flex}
.danger i{flex:1}
</style>
</head>

<div class="card">
